name: CI

on:
  push:
    branches: [main, base, "devin/**"]
  pull_request:
    branches: [main, base]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Check imports and syntax
        run: python -c "import src.parser.time_parser; import src.parser.dayrep_parser; import src.cascade.cascade_detector; import src.export.excel_exporter; print('All imports OK')"
